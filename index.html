<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Webb Family Private Storybook</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Patrick+Hand&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #fdf6e9;
      --card: #fffdf7;
      --ink: #231a14;
      --ink-soft: #57473a;
      --terracotta: #c85a2b;
      --amber: #df9a32;
      --amber-soft: #fbf0d3;
      --pine: #366247;
      --pine-soft: #e1efe5;
      --danger: #b42318;
      --danger-bg: #fef3f2;
      --font-display: 'Fraunces', Georgia, serif;
      --font-body: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      --font-comic: 'Patrick Hand', 'Comic Sans MS', cursive;
    }

    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100dvh;
      display: grid;
      place-items: start center;
      padding: clamp(1.25rem, 6vh, 3.5rem) 1rem 2rem;
      font-family: var(--font-body);
      color: var(--ink);
      background:
        radial-gradient(circle at 18% 12%, rgba(223, 154, 50, 0.22), transparent 42%),
        radial-gradient(circle at 82% 88%, rgba(54, 98, 71, 0.16), transparent 44%),
        var(--paper);
    }

    .gate-card {
      width: min(440px, 100%);
      background: var(--card);
      border: 3px solid var(--ink);
      border-radius: 22px;
      box-shadow: 6px 6px 0 var(--ink);
      padding: clamp(1.35rem, 4vw, 2rem);
    }

    .badge-row {
      display: flex;
      justify-content: center;
      margin-bottom: 0.75rem;
    }

    .comic-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-family: var(--font-comic);
      font-size: 1rem;
      padding: 0.2rem 0.8rem;
      border-radius: 999px;
      border: 2px solid var(--ink);
      background: var(--amber-soft);
      color: var(--ink);
    }

    h1 {
      font-family: var(--font-display);
      font-size: clamp(1.5rem, 5vw, 1.95rem);
      line-height: 1.15;
      text-align: center;
      margin: 0 0 0.45rem;
    }

    .gate-lead {
      text-align: center;
      font-size: 0.95rem;
      color: var(--ink-soft);
      margin: 0 0 1.25rem;
      line-height: 1.45;
    }

    .field {
      margin-bottom: 1rem;
    }

    label {
      display: block;
      font-weight: 700;
      font-size: 0.9rem;
      margin-bottom: 0.4rem;
    }

    .input-wrap {
      display: flex;
      gap: 0.5rem;
      align-items: stretch;
    }

    input[type="password"],
    input[type="text"] {
      flex: 1;
      min-width: 0;
      min-height: 48px;
      padding: 0.65rem 0.9rem;
      font-family: var(--font-body);
      font-size: 1rem;
      color: var(--ink);
      background: #fff;
      border: 2px solid var(--ink);
      border-radius: 12px;
      transition: border-color 0.15s ease, background-color 0.15s ease;
    }

    input:focus-visible {
      outline: 3px solid var(--amber);
      outline-offset: 2px;
    }

    :is(input:user-invalid, input.user-invalid-fallback, input[aria-invalid="true"]) {
      border-color: var(--danger);
      background-color: var(--danger-bg);
    }

    .toggle-btn {
      min-height: 48px;
      padding: 0 0.9rem;
      border: 2px solid var(--ink);
      border-radius: 12px;
      background: var(--amber-soft);
      color: var(--ink);
      font-family: var(--font-body);
      font-weight: 700;
      font-size: 0.88rem;
      cursor: pointer;
      white-space: nowrap;
    }

    .toggle-btn:hover,
    .toggle-btn:focus-visible {
      background: #f5dfab;
      outline: 2px solid var(--terracotta);
      outline-offset: 2px;
    }

    .error-msg {
      display: none;
      margin: 0.5rem 0 0;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--danger);
      line-height: 1.4;
    }

    .error-msg.is-visible {
      display: block;
    }

    .unlock-btn {
      width: 100%;
      min-height: 50px;
      padding: 0.8rem 1.25rem;
      border-radius: 999px;
      border: 2.5px solid var(--ink);
      background: var(--terracotta);
      color: #fff;
      font-family: var(--font-body);
      font-weight: 700;
      font-size: 1.02rem;
      cursor: pointer;
      box-shadow: 4px 4px 0 var(--ink);
      transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
    }

    .unlock-btn:hover,
    .unlock-btn:focus-visible {
      transform: translate(-1px, -1px);
      box-shadow: 5px 5px 0 var(--ink);
      outline: 3px solid var(--amber);
      outline-offset: 2px;
    }

    .unlock-btn:disabled {
      opacity: 0.65;
      cursor: wait;
      transform: none;
    }

    .gate-footnote {
      margin: 1rem 0 0;
      text-align: center;
      font-family: var(--font-comic);
      font-size: 0.98rem;
      color: var(--ink-soft);
    }

    .visually-hidden:where(:not(:focus-within, :active)) {
      position: absolute !important;
      clip-path: inset(50%) !important;
      overflow: hidden !important;
      width: 1px !important;
      height: 1px !important;
      margin: -1px !important;
      padding: 0 !important;
      border: 0 !important;
      white-space: nowrap !important;
    }

    body.is-checking .gate-card {
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body class="is-checking">
  <main class="gate-card" aria-labelledby="gate-title">
    <div class="badge-row">
      <span class="comic-badge">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
        Private Family Access
      </span>
    </div>
    <h1 id="gate-title">Webb Family Private Storybook</h1>
    <p class="gate-lead">Enter our secret family passcode to unlock the adventure on this device.</p>

    <form id="unlock-form" novalidate>
      <div class="field">
        <label for="family-passcode">Family Passcode</label>
        <div class="input-wrap">
          <input
            type="password"
            id="family-passcode"
            name="passcode"
            autocomplete="current-password"
            enterkeyhint="done"
            spellcheck="false"
            autocapitalize="off"
            autocorrect="off"
            required
            aria-invalid="false"
            data-error="passcode-error"
          >
          <button type="button" id="toggle-passcode" class="toggle-btn" aria-pressed="false" aria-controls="family-passcode">Show</button>
        </div>
        <p id="passcode-error" class="error-msg">Please enter our family passcode to unlock the storybook.</p>
      </div>
      <button type="submit" id="unlock-btn" class="unlock-btn">Unlock Storybook</button>
    </form>

    <p class="gate-footnote">Protected with AES-256 encryption. Your device remembers access after your first unlock.</p>
  </main>

        else input.removeAttribute('aria-describedby');
      };

      const setErrorState = (shown, msg, announce = false) => {
        if (msg) errorEl.textContent = msg;
        errorEl.classList.toggle('is-visible', shown);
        input.classList.toggle('user-invalid-fallback', shown);
        input.setAttribute('aria-invalid', shown ? 'true' : 'false');
        linkError(shown);
        clearTimeout(announceTimer);
        if (shown && announce) {
          announcer.textContent = '';
          announceTimer = setTimeout(() => { announcer.textContent = errorEl.textContent; }, 250);
        } else if (!shown) {
          announcer.textContent = '';
        }
      };

      const b64ToBytes = (b64) => {
        const bin = atob(b64);
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        return bytes;
      };

      const bytesToB64 = (bytes) => {
        let bin = '';
        for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
        return btoa(bin);
      };

      const deriveRawKey = async (passphrase) => {
        const enc = new TextEncoder();
        const keyMaterial = await crypto.subtle.importKey(
          'raw',
          enc.encode(passphrase),
          'PBKDF2',
          false,
          ['deriveBits']
        );
        const bits = await crypto.subtle.deriveBits(
          { name: 'PBKDF2', salt: b64ToBytes(SALT_B64), iterations: ITERATIONS, hash: 'SHA-256' },
          keyMaterial,
          256
        );
        return new Uint8Array(bits);
      };

      const decryptWithRawKey = async (rawKeyBytes) => {
        const aesKey = await crypto.subtle.importKey(
          'raw',
          rawKeyBytes,
          { name: 'AES-GCM' },
          false,
          ['decrypt']
        );
        const plainBuf = await crypto.subtle.decrypt(
          { name: 'AES-GCM', iv: b64ToBytes(IV_B64) },
          aesKey,
          b64ToBytes(PAYLOAD_B64)
        );
        return new TextDecoder().decode(plainBuf);
      };

      const mountUnlockedPage = (html) => {
        document.open();
        document.write(html);
        document.close();
      };

      // Toggle password visibility so mobile users can double-check spelling/caps
      toggleBtn.addEventListener('click', () => {
        const reveal = input.type === 'password';
        input.type = reveal ? 'text' : 'password';
        toggleBtn.textContent = reveal ? 'Hide' : 'Show';
        toggleBtn.setAttribute('aria-pressed', String(reveal));
        input.focus();
      });

      input.addEventListener('input', () => {
        if (input.getAttribute('aria-invalid') === 'true') {
          setErrorState(false);
        }
      });

      input.addEventListener('blur', () => {
        if (!input.value.trim() && input.matches && CSS.supports('selector(:user-invalid)') && input.matches(':user-invalid')) {
          setErrorState(true, 'Please enter our family passcode to unlock the storybook.', true);
        }
      });

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const val = input.value;
        if (!val) {
          setErrorState(true, 'Please enter our family passcode to unlock the storybook.', true);
          input.focus();
          return;
        }
        if (!window.crypto || !window.crypto.subtle) {
          setErrorState(true, 'Secure HTTPS browser encryption is required to unlock this page.', true);
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = 'Unlocking...';
        try {
          const rawKey = await deriveRawKey(val);
          const html = await decryptWithRawKey(rawKey);
          try {
            localStorage.setItem(STORAGE_KEY, bytesToB64(rawKey));
          } catch {}
          mountUnlockedPage(html);
        } catch {
          submitBtn.disabled = false;
          submitBtn.textContent = 'Unlock Storybook';
          setErrorState(true, 'That passcode did not match. Check capitalization (or tap Show) and try again.', true);
          input.focus();
          input.select();
        }
      });

      // Auto-unlock returning devices using saved derived key (never storing plaintext passcode)
      (async () => {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          if (saved && window.crypto && window.crypto.subtle) {
            const html = await decryptWithRawKey(b64ToBytes(saved));
            mountUnlockedPage(html);
            return;
          }
        } catch {
          try { localStorage.removeItem(STORAGE_KEY); } catch {}
        }
        document.body.classList.remove('is-checking');
        input.focus();
      })();
    })();
  </script>
</body>
</html>
